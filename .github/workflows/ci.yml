name: Khushboo Pathshala CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || true

      - name: Production Build Verification
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_API_BASE: ""

  backend-check:
    name: Backend Syntax & Security Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, curl, mbstring, openssl, gd, zip

      - name: PHP Syntax Check (Lint)
        run: |
          find drupal-backend/web/modules/custom -name "*.php" -exec php -l {} \;

      - name: Security Scan for Hardcoded Backdoors
        run: |
          if grep -rn "password === 'password123'" drupal-backend/web/modules/custom/; then
            echo "❌ ERROR: Hardcoded password backdoor found!"
            exit 1
          fi
          echo "✅ Security scan passed: No password backdoors detected."
