version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: khushboo_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${KP_DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${KP_DB_NAME:-khushboo_drupal}
      MYSQL_USER: ${KP_DB_USER:-khushboo_user}
      MYSQL_PASSWORD: ${KP_DB_PASS:-khushboo_secure_pass_2026}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./khushboo_drupal.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./drupal-backend/db-migrations/001_production_hardening.sql:/docker-entrypoint-initdb.d/02_hardening.sql:ro
    ports:
      - "3306:3306"
    networks:
      - khushboo_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./drupal-backend
      dockerfile: Dockerfile
    container_name: khushboo_backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      KP_DB_NAME: ${KP_DB_NAME:-khushboo_drupal}
      KP_DB_USER: ${KP_DB_USER:-khushboo_user}
      KP_DB_PASS: ${KP_DB_PASS:-khushboo_secure_pass_2026}
      KP_DB_HOST: mariadb
      KP_JWT_SECRET: ${KP_JWT_SECRET:-khushboo_pathshala_prod_secret_replace_in_env}
      KP_CORS_ORIGINS: ${KP_CORS_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      KP_HASH_SALT: ${KP_HASH_SALT:-khushboo_drupal_production_hash_salt_2026}
    volumes:
      - backend_files:/var/www/html/web/sites/default/files
    ports:
      - "5001:80"
    networks:
      - khushboo_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_API_BASE: ""
    container_name: khushboo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - khushboo_network

networks:
  khushboo_network:
    driver: bridge

volumes:
  mariadb_data:
  backend_files:
